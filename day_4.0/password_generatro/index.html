    <title>password generator</title>
</head>

<body>
    <div class="container">
        <h1 id="h-top">Generate a</h1>
        <h2 id="h-down">random password</h2>

        <button id="btn-el" onclick="generatePass()">Generate password</button>
        <div class="input">
            <input type="text" id="pass-1-el" onclick="copyPassword()" title="click to copy password">

        </div>
    </div>
