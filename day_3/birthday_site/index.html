<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap"
        rel="stylesheet">
    <title>birthday site</title>
</head>

<body>
    <div id="header">
        <h1>Today is Manjesh birthday</h1>
        <img src="../images/manjesh.jpg" alt="manjesh photo at tree" id="b-boy">
        <h2 id="b-age">24 years old</h2>
        <h4 id="b-date">21/03/2001</h4>
    </div>
    <div class="gift-section">
        <h2 class="gift-title">Here's how happy I am for you today 😍</h2>
        <h3 class="gift-hint">(Hover over the gift)</h3>
        <div class="gift-img"></div>

    </div>
    <div class="gift-section">
        <h2 class="gift-title">How people react when you enter ther room 😍</h2>
        <div class="gift-img" id="gift-img-happy"></div>

    </div>
    <div class="gift-section">
        <h2 class="gift-title">This one's for you my friends 😍</h2>
        <div class="gift-img" id="gift-img-cheers"></div>

    </div>
    <div class="footer">
        <h3>Want to create your own Birthday Gift site: Take this HTML & CSS course.</h3>
        <a href="https://www.linkedin.com/in/manjesh-kumar-kushwaha-764078241/">connect with me
        </a>
    </div>
</body>

</html>
