<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>basketball scoreboard</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div class="sc-container">
            <H3>HOME</H3>
            <div class="scoreboard">
                <h1 id="home-sc">0</h1>
            </div>
            <div class="btn-div">
                <button onclick="add1Home()">+1</button>
                <button onclick="add2Home()">+2</button>
                <button onclick="add3Home()">+3</button>
            </div>
            <p id="home-scard"></p>
        </div>
        <div class="sc-container">
            <h3>GUEST</h3>
            <div class="scoreboard">
                <h1 id="guest-sc">0</h1>
            </div>
            <div class="btn-div">
                <button onclick="add1Guest()">+1</button>
                <button onclick="add2Guest()">+2</button>
                <button onclick="add3Guest()">+3</button>
            </div>
            <p id="guest-scard"></p>
        </div>

    </div>
    <script src="index.js"></script>
</body>

</html>
